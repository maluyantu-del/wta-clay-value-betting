[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wta-clay-value-betting"
version = "0.0.1"
description = "Quantitative value-betting research for WTA clay-court matches."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "rapidfuzz>=3.6",
    "scikit-learn>=1.3",
    "lightgbm>=4.1",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ipykernel", "jupyter"]
# Only needed if you keep legacy Tennis-Data .xls files rather than CSVs.
xls = ["xlrd==1.2.0"]

[tool.setuptools.packages.find]
include = ["wta_clay*"]
exclude = ["tests*", "notebooks*", "artifacts*", "data*", "examples*"]
